<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Twitch Badge Check</title>
<style>
  :root{--bg:#0e0e10;--card:#18181b;--fg:#efeff1;--mut:#adadb8;--ok:#00c853;--no:#ff4d4d;--acc:#9147ff}
  @media(prefers-color-scheme:light){:root{--bg:#f7f7f8;--card:#fff;--fg:#0e0e10;--mut:#53535f}}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
  main{max-width:860px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
  h1{font-size:22px;margin:0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--card);padding:12px;border-radius:8px;margin-bottom:16px}
  .bar .sp{flex:1}
  .btn{padding:8px 14px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;font:inherit}
  label{color:var(--mut);font-size:13px;display:flex;gap:4px;align-items:center}
  select{background:var(--card);color:var(--fg);border:1px solid var(--mut);border-radius:6px;padding:4px 6px;font:inherit}
  #msg{margin:0 0 12px;color:var(--mut)}
  #msg.err{color:var(--no)}
  .ev{background:var(--card);border-radius:8px;padding:12px;margin-bottom:10px}
  .ev h2{font-size:16px;margin:0 0 2px}
  .ev small{color:var(--mut)}
  .b{display:flex;gap:10px;align-items:center;margin-top:8px}
  .b img{width:36px;height:36px}
  .b .t{flex:1}
  .b .d{color:var(--mut);font-size:12px}
  .tag{font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer;user-select:none}
  .have{color:var(--ok)} .miss{color:var(--no)}
  .sum{font-weight:600;color:var(--fg)}
  footer{margin-top:24px;padding-top:12px;border-top:1px solid var(--card);color:var(--mut);font-size:12px;line-height:1.5}
  footer a{color:var(--acc)}
  details{background:var(--card);border-radius:8px;padding:12px;margin-bottom:16px;color:var(--mut)}
  summary{cursor:pointer;color:var(--fg)}
  ol{padding-left:20px} code,textarea{font-size:12px}
  textarea{width:100%;height:90px;background:transparent;color:inherit;border:1px solid var(--mut);border-radius:6px}
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="title"></h1>
    <label><span class="sr" data-i18n="language"></span>
      <select id="lang" aria-label="Language">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
      </select>
    </label>
  </header>
  <div class="bar">
    <span id="who"></span><span class="sp"></span>
    <label><input type="checkbox" id="miss" checked> <span data-i18n="onlyMissing"></span></label>
    <label><span data-i18n="display"></span>
      <select id="view">
        <option value="now" data-i18n="viewNow"></option>
        <option value="up" data-i18n="viewUp"></option>
        <option value="all" data-i18n="viewAll"></option>
      </select>
    </label>
    <label><span data-i18n="type"></span>
      <select id="cost">
        <option value="all" data-i18n="costAll"></option>
        <option value="free" data-i18n="costFree"></option>
        <option value="paid" data-i18n="costPaid"></option>
      </select>
    </label>
  </div>
  <details id="how">
    <summary data-i18n="howTitle"></summary>
    <ol>
      <li><span data-i18n="how1"></span> <a class="btn" id="bm" href="#" data-i18n="bmName"></a></li>
      <li data-i18n="how2"></li>
      <li data-i18n="how3"></li>
    </ol>
    <span data-i18n-html="privacy"></span>
    <p data-i18n="consoleAlt"></p>
    <textarea id="code" readonly></textarea>
    <p data-i18n="manualAlt"></p>
  </details>
  <p id="msg"></p>
  <div id="out"></div>
  <footer data-i18n-html="footer"></footer>
</main>
<script>
const SD='<a href="https://www.streamdatabase.com/events" target="_blank" rel="noopener">StreamDatabase</a>';
const I18N={
 de:{loc:'de-DE',title:'Twitch Badge Check',language:'Sprache',onlyMissing:'nur fehlende',display:'Anzeige',
  viewNow:'Aktuelle',viewUp:'Nur kommende',viewAll:'Aktuelle + kommende',
  type:'Art',costAll:'Alle',costFree:'Gratis (Watchtime)',costPaid:'Bezahlt (Subs, Tickets)',
  howTitle:'Meine Badges von Twitch laden',how1:'Diesen Button in die Lesezeichenleiste ziehen:',bmName:'Badges holen',
  how2:'twitch.tv öffnen (eingeloggt sein) und das Lesezeichen anklicken.',how3:'Du landest hier zurück, deine Badges sind gespeichert.',
  privacy:'Der Code läuft nur auf twitch.tv in deinem Browser. Dein Login verlässt Twitch nicht, hierher wird nur die Badge-Liste übergeben (im <code>#</code>-Teil der URL, der nie an den Server geht).',
  consoleAlt:'Alternativ: Code in die Konsole (F12) von twitch.tv einfügen:',
  manualAlt:'Oder ohne alles: in der Liste unten auf „fehlt/vorhanden“ klicken, um Badges von Hand zu markieren.',
  who:n=>`Badges von <b>${n}</b> geladen`,whoNone:'Noch keine Badges geladen (manuelles Markieren möglich)',
  have:'✓ vorhanden',miss:'✗ fehlt',until:d=>`läuft bis ${d}`,unknown:'unbekannt',starts:d=>`startet ${d}`,
  nothing:'Nichts anzuzeigen.',summary:(h,t)=>`${h} von ${t} Badges vorhanden, ${t-h} fehlen.`,
  evErr:m=>`Events konnten nicht geladen werden: ${m}`,
  bmNote:'Nicht klicken, sondern in die Lesezeichenleiste ziehen.',notLogged:'Bei twitch.tv nicht angemeldet',noBadges:'Twitch hat keine Badges geliefert',
  footer:`Die Badge-Events stammen von ${SD}, der Besitz deiner Badges wird über Twitchs inoffizielle GraphQL-Schnittstelle (gql.twitch.tv) abgefragt. Diese Seite ist nicht mit Twitch Interactive, Inc. oder StreamDatabase verbunden, von ihnen unterstützt oder betrieben. Twitch und die Badges sind Marken bzw. Eigentum der jeweiligen Inhaber. Angaben ohne Gewähr.`},
 en:{loc:'en-GB',title:'Twitch Badge Check',language:'Language',onlyMissing:'only missing',display:'Show',
  viewNow:'Current',viewUp:'Upcoming only',viewAll:'Current + upcoming',
  type:'Type',costAll:'All',costFree:'Free (watch time)',costPaid:'Paid (subs, tickets)',
  howTitle:'Load my badges from Twitch',how1:'Drag this button to your bookmarks bar:',bmName:'Get badges',
  how2:'Open twitch.tv (while logged in) and click the bookmark.',how3:'You will land back here and your badges are saved.',
  privacy:'The code only runs on twitch.tv in your browser. Your login never leaves Twitch; only the badge list is passed here (in the <code>#</code> part of the URL, which is never sent to the server).',
  consoleAlt:'Alternatively, paste this code into the console (F12) on twitch.tv:',
  manualAlt:'Or without any of that: click “missing/owned” in the list below to mark badges by hand.',
  who:n=>`Badges of <b>${n}</b> loaded`,whoNone:'No badges loaded yet (manual marking possible)',
  have:'✓ owned',miss:'✗ missing',until:d=>`runs until ${d}`,unknown:'unknown',starts:d=>`starts ${d}`,
  nothing:'Nothing to show.',summary:(h,t)=>`${h} of ${t} badges owned, ${t-h} missing.`,
  evErr:m=>`Could not load events: ${m}`,
  bmNote:'Don’t click it, drag it to your bookmarks bar.',notLogged:'Not logged in to twitch.tv',noBadges:'Twitch returned no badges',
  footer:`Badge events come from ${SD}; your badge ownership is read via Twitch’s unofficial GraphQL interface (gql.twitch.tv). This site is not affiliated with, endorsed by or operated by Twitch Interactive, Inc. or StreamDatabase. Twitch and the badges are trademarks or property of their respective owners. No guarantee of accuracy.`},
 fr:{loc:'fr-FR',title:'Twitch Badge Check',language:'Langue',onlyMissing:'seulement manquants',display:'Affichage',
  viewNow:'En cours',viewUp:'À venir uniquement',viewAll:'En cours + à venir',
  type:'Type',costAll:'Tous',costFree:'Gratuit (temps de visionnage)',costPaid:'Payant (abonnements, billets)',
  howTitle:'Charger mes badges depuis Twitch',how1:'Faites glisser ce bouton dans votre barre de favoris :',bmName:'Récupérer les badges',
  how2:'Ouvrez twitch.tv (connecté) et cliquez sur le favori.',how3:'Vous revenez ici et vos badges sont enregistrés.',
  privacy:'Le code ne s’exécute que sur twitch.tv dans votre navigateur. Votre connexion ne quitte pas Twitch ; seule la liste des badges est transmise ici (dans la partie <code>#</code> de l’URL, jamais envoyée au serveur).',
  consoleAlt:'Ou collez ce code dans la console (F12) de twitch.tv :',
  manualAlt:'Ou sans rien de tout cela : cliquez sur « manquant/possédé » dans la liste ci-dessous pour marquer les badges à la main.',
  who:n=>`Badges de <b>${n}</b> chargés`,whoNone:'Aucun badge chargé (marquage manuel possible)',
  have:'✓ possédé',miss:'✗ manquant',until:d=>`jusqu’au ${d}`,unknown:'inconnu',starts:d=>`début le ${d}`,
  nothing:'Rien à afficher.',summary:(h,t)=>`${h} badges sur ${t} possédés, ${t-h} manquants.`,
  evErr:m=>`Impossible de charger les événements : ${m}`,
  bmNote:'Ne cliquez pas, faites-le glisser dans la barre de favoris.',notLogged:'Non connecté à twitch.tv',noBadges:'Twitch n’a renvoyé aucun badge',
  footer:`Les événements de badges proviennent de ${SD} ; la possession de vos badges est lue via l’interface GraphQL non officielle de Twitch (gql.twitch.tv). Ce site n’est ni affilié à, ni soutenu, ni exploité par Twitch Interactive, Inc. ou StreamDatabase. Twitch et les badges sont des marques ou la propriété de leurs détenteurs respectifs. Sans garantie.`},
 es:{loc:'es-ES',title:'Twitch Badge Check',language:'Idioma',onlyMissing:'solo faltantes',display:'Mostrar',
  viewNow:'Actuales',viewUp:'Solo próximas',viewAll:'Actuales + próximas',
  type:'Tipo',costAll:'Todas',costFree:'Gratis (tiempo de visionado)',costPaid:'De pago (suscripciones, entradas)',
  howTitle:'Cargar mis insignias de Twitch',how1:'Arrastra este botón a tu barra de marcadores:',bmName:'Obtener insignias',
  how2:'Abre twitch.tv (con sesión iniciada) y haz clic en el marcador.',how3:'Volverás aquí y tus insignias quedarán guardadas.',
  privacy:'El código solo se ejecuta en twitch.tv en tu navegador. Tu sesión no sale de Twitch; aquí solo se pasa la lista de insignias (en la parte <code>#</code> de la URL, que nunca se envía al servidor).',
  consoleAlt:'O pega este código en la consola (F12) de twitch.tv:',
  manualAlt:'O sin nada de eso: haz clic en «falta/tienes» en la lista de abajo para marcar las insignias a mano.',
  who:n=>`Insignias de <b>${n}</b> cargadas`,whoNone:'Aún no hay insignias cargadas (marcado manual posible)',
  have:'✓ tienes',miss:'✗ falta',until:d=>`hasta el ${d}`,unknown:'desconocido',starts:d=>`empieza el ${d}`,
  nothing:'Nada que mostrar.',summary:(h,t)=>`${h} de ${t} insignias conseguidas, faltan ${t-h}.`,
  evErr:m=>`No se pudieron cargar los eventos: ${m}`,
  bmNote:'No hagas clic, arrástralo a la barra de marcadores.',notLogged:'No has iniciado sesión en twitch.tv',noBadges:'Twitch no devolvió insignias',
  footer:`Los eventos de insignias provienen de ${SD}; la posesión de tus insignias se consulta mediante la interfaz GraphQL no oficial de Twitch (gql.twitch.tv). Este sitio no está afiliado, respaldado ni operado por Twitch Interactive, Inc. ni StreamDatabase. Twitch y las insignias son marcas o propiedad de sus respectivos dueños. Sin garantía.`},
};

const $=id=>document.getElementById(id);
const parse=(d,t)=>new Date(`${d}T${t||'00:00'}:00Z`);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let events=[],owned=new Set(store.get('owned')||[]),name=store.get('name')||'';
let imported=!!store.get('imported'),evError=null;

// Sprache: gespeichert > Browser > Deutsch
const pick=l=>I18N[String(l||'').slice(0,2).toLowerCase()]?String(l).slice(0,2).toLowerCase():null;
let lang=pick(store.get('lang'))||pick(navigator.language)||'de';
const t=()=>I18N[lang];

// Bookmarklet / Konsolen-Code (läuft auf twitch.tv), Meldungen in der gewählten Sprache
function buildCode(){
  const m=t();
  return `(async()=>{try{const t=document.cookie.match(/(?:^|; )auth-token=([^;]+)/)?.[1];
if(!t)return alert(${JSON.stringify(m.notLogged)});
const r=await fetch('https://gql.twitch.tv/gql',{method:'POST',headers:{'Client-ID':'kimne78kx3ncx6brgo4mv6wki5h1ko',Authorization:'OAuth '+t},
body:JSON.stringify({query:'{currentUser{displayName availableBadges{setID version}}}'})});
const u=(await r.json()).data?.currentUser;
if(!u)return alert(${JSON.stringify(m.noBadges)});
window.open('${location.origin}/#d='+encodeURIComponent(JSON.stringify({n:u.displayName,b:u.availableBadges.map(x=>x.setID+'/'+x.version)})))}catch(e){alert(e.message)}})()`.replace(/\n/g,'');
}
$('bm').onclick=e=>{e.preventDefault();alert(t().bmNote)};

function applyLang(){
  const m=t();
  document.documentElement.lang=lang;
  $('lang').value=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=m[el.dataset.i18n]);
  document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=m[el.dataset.i18nHtml]);
  const c=buildCode();
  $('code').value=c;
  $('bm').href='javascript:'+encodeURIComponent(c);
  render();
}

// Import aus dem URL-Fragment
function importHash(){
  if(!location.hash.startsWith('#d=')) return;
  try{
    const d=JSON.parse(decodeURIComponent(location.hash.slice(3)));
    owned=new Set(d.b);name=d.n||'';imported=true;
    store.set('owned',[...owned]);store.set('name',name);store.set('imported',true);
  }catch{}
  history.replaceState(null,'',location.pathname);
}
importHash();
window.addEventListener('hashchange',()=>{importHash();render()});
if(!imported) $('how').open=true;

function save(){store.set('owned',[...owned])}
function render(){
  const m=t(),now=new Date(),onlyMissing=$('miss').checked,view=$('view').value,cost=$('cost').value;
  const fmt=d=>d.toLocaleString(m.loc);
  $('who').innerHTML=imported?m.who(esc(name)):m.whoNone;
  if(evError){$('msg').textContent=m.evErr(evError);$('msg').className='err';return}
  $('msg').className='';
  const list=events.map(e=>({e,s:parse(e.start_at_date,e.start_at_time),f:e.end_at_date?parse(e.end_at_date,e.end_at_time):null}))
    .filter(x=>{
      const current=x.s<=now&&(!x.f||x.f>=now),upcoming=x.s>now;
      return view==='up'?upcoming:view==='all'?current||upcoming:current;
    })
    .sort((a,b)=>(a.f||1e15)-(b.f||1e15));
  let have=0,total=0;
  $('out').innerHTML=list.map(({e,s,f})=>{
    const rows=e.badges.map(b=>{
      const k=b.set_id+'/'+b.version,has=owned.has(k);total++;if(has)have++;
      if(onlyMissing&&has) return '';
      if(cost!=='all'&&b.cost!==cost) return '';
      return `<div class="b"><img src="${esc(b.image)}" alt=""><div class="t"><b>${esc(b.title)}</b>
        <div class="d">${esc(b.description)}</div></div>
        <span class="tag ${has?'have':'miss'}" data-k="${esc(k)}">${has?m.have:m.miss}</span></div>`}).join('');
    if(!rows) return '';
    const when=s<=now?m.until(f?fmt(f):m.unknown):m.starts(fmt(s));
    return `<div class="ev"><h2>${esc(e.title)}</h2><small>${when}</small>${rows}</div>`}).join('')||`<p>${m.nothing}</p>`;
  $('msg').innerHTML=`<span class="sum">${m.summary(have,total)}</span>`;
}
$('out').onclick=e=>{const k=e.target.dataset?.k;if(!k)return;owned.has(k)?owned.delete(k):owned.add(k);save();render()};
$('miss').onchange=$('view').onchange=$('cost').onchange=render;
$('lang').onchange=e=>{lang=e.target.value;store.set('lang',lang);applyLang()};

applyLang();
fetch('/api/events').then(r=>r.json()).then(d=>{events=d;render()})
  .catch(e=>{evError=e.message;render()});
</script>
</body>
</html>
